services:
  prerender:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://valkey:6379
      - PAGE_TTL=604800  # Cache TTL: 7 days (seconds)
      - MAX_CONCURRENT_RENDERS=10  # Max concurrent rendering (different URLs)
      - LOCK_TTL=30  # Lock timeout (seconds)
      - DISABLE_IMAGES=false  # Measured no effect on real pages, see README
      - WAIT_AFTER_LAST_REQUEST=300  # Upstream default 500ms; lower saves time but risks capturing mid-load
      - MAX_WAIT_MS=8000  # How long a duplicate request waits for the in-flight render before 429
      - PAGE_DONE_CHECK_INTERVAL=100  # Upstream default 500ms
    # Idle ~300MB, plus ~90MB per concurrent render, so MAX_CONCURRENT_RENDERS=10
    # tops out around 1.2GB. Keep this above that or the host absorbs the spike.
    mem_limit: 1500m
    depends_on:
      - valkey
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  valkey-data:
